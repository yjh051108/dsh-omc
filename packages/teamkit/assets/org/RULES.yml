# 判据：出现第二处时，**能指出"谁是权威来源"** —— **指不出 ⇒ 那就是两处写。**
# ```
# **与 `R10`（SOT）的关系**：
# ```
# `R10` 管 **"事实只写一处"**；本条管 **"命名空间的分配权"**。
# ⇒ 一个是"写几遍"，一个是"谁有权分配名字" —— **互补，不重复**。
# ```
