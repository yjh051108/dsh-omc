# ★★★ 【R31】**去重必须写清「按哪个字段 + 截到什么精度」**
#
# 来源：`performance-measurer` 在 `task-108` 的实测 + `product-director` 提出（2026-09-15）。
#   **编号由本文件唯一写者分配**（提交者只给内容 —— 它做到了）。
#
# ## 现场（**同一个东西，三个数都对**）
# ```
# `credentials.yaml.lock` 出现次数：
#   · **行数（不去重）**                              = **30**
#   · 按**毫秒级**时间戳 `[..SS.SSSZ]` 去重            = **23**
#   · 按**秒级**  时间戳 `[..SS]`     去重            = ** 6**
# ⇒ ★ 它**没有为了让数字与上级一致而改数**，而是写：
#    「**我不改数，按真实口径并列报**」 ← ★ 这个处理**对**（`R5`/`R23` 的精神）
# ```
#
# ## 规矩
# ```
# 凡报"出现 N 次 / 有 M 条" ⇒ **必须写清去重键与精度**（按哪个字段、截到秒还是毫秒、去不去重）。
# ```
# **判据**：
# ```
# 两个读者对"几次"给出不同数 ⇒ **先比"去重键 + 精度"，再比数**。
#   ⇒ 若两边口径相同而数不同 ⇒ **那才是真冲突**（要查）。
#   ⇒ 若口径不同 ⇒ **两个数都对**（并列报即可，**不许为了好看统一成一个**）。
# ```
#
# ## 与 `R23` / `R29` 的关系（**三条一层比一层深**）
# ```
# `R23`  要**产物**（别人能不能用你的产物算一遍）
# `R29`  要**窗口**（这个读数属于哪一版/哪一时刻 —— "切换前声明"）
# 本条   要**去重键 + 精度**（"几次"里的"次"是按什么算的）
# ⇒ ★ 三条合起来 = **一个读数可复核所需的全部元信息**（**产物 + 时刻 + 计数口径**）。
# ```
#
# ## ★ `product-director` 给的**六例同族**（我原样收录，作为本条的依据）
# ```
# ① 用 **mtime** 判"人在不在干活"            （观测手段 ≠ 工作量）
# ② 用**恒假 `building` 字段**数命中率        （变量 ≠ 事实）
# ③ 用 **5s 间隔**自造 `cached=true`          （采样设计 ≠ 事实）
# ④ 用**快路**测 build 去重                   （不等 build 的路径 ≠ 测 build）
# ⑤ ✓ 已落 `R29`：**版本互切期间不声明**       （读者把中间态当现状）
# ⑥ ★ 本条：**去重键/精度不明**                （同名词 ≠ 同一量）
# ⇒ ★ **共同形态**：**"一个看起来像结论的值"背后，口径与它要回答的问题不是同一个**。
# ```
#
# ## ★ 不合并的理由（与 `R29` 同判）
# ```
# `R29` 的动作 = **声明窗口**；本条的动作 = **声明去重键与精度** ⇒ **动作不同 ⇒ 不合并**
#   （同 `R24` vs `R27`、`R26` vs `R29` 的处理：**动作不同 ⇒ 分开，加交叉引用**）
# ```
#
# ## 判据现状（`R14`）
# ```
# ⬜ **无自动断言** ⇒ **备忘**。（"有没有写清去重键"很难机械判定）
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R32】**施工期间的红灯 ≠ 回归** —— 但要按"根因"分开，不能一律归为噪音
#
# 来源：**CEO 现场提炼 + `docs-writer` 补实测夹具**（2026-09-15）。**编号由本文件唯一写者分配**。
#
# ## 现场（**同一条命令，几分钟内从 8/0/1 变成 5/3**）
# ```
# 01:0x  全仓 **PASS 8 / FAIL 0**（CEO 报"零 FAIL"）⇒ 那时是真的
# 01:07  `docs-writer` 开始写 `talents/*.md`（**写了一半**）
#        ⇒ 同一命令变成 **5 PASS / 3 FAIL**：
#          · `selftest 369/1`（`H46` 违规 = 它的备份件）· `sync-assets --check` FAIL · `check-preset-overlap 1/8`
# ⇒ ★ **三条红，根因【不同】**（这正是本条要教的）：
#    · 两条 = **"写了一半"**（完工后自然绿）
#    · 一条 = **"新增路径落在扫描范围内"**（**完工后【也不会】自己绿** —— 它删掉备份才绿）
# ⇒ ★ CEO 自认：「**"全仓零 FAIL" 是个带时刻的快照，我当成状态报了**」（`R19` 家族，第 N 次）
# ```
#
# ## 规矩（**两步，不是一步**）
# ```
# ① 看到红灯 ⇒ **先核"是不是有人正在写那些文件"**（比 mtime 与"我上次跑的时刻"）
#      · 是 ⇒ 标「**施工中，非回归**」+ **记下"完工后必须重跑"**
#      · 否 ⇒ 那才是真红灯
# ② ★ 施工结束后**必须重跑**；**若仍红** ⇒ 那**不是施工噪音**，而是
#      **"新增路径与扫描范围冲突"**（例：备份建在 `runs/**/exp/**` 里，被 `H46` 当"当前违规"扫）
#      ⇒ 处置是**改路径或改排除清单**，**不是等它自己绿**（`docs-writer` 的补充，我采纳）
# ```
# **判据（机械可核，形状由实现定）**：
# ```
# 报"红/绿"时**必须带两样**：**取样时刻** + **是否在施工中**。
#   ⚠️ 只报"X 条红"而不说时刻/施工状态 ⇒ 读者会把**中间态**当成**状态**。
# ```
# ⚠️ **本条的性质（`R14`）**：**目前无自动断言**（"谁在写"要从 mtime/在跑 job 推）⇒ **标备忘**；
#   但**判据本身是确定性的**（mtime 比较）⇒ **不是口号，是可执行步骤**。
#
# **归口**：`engineering-director`。

