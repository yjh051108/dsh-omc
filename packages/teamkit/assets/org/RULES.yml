# ★★★ 【R35】**发布前判据 · 四层**（越靠后越硬）+「测完不留污染」
#
# 来源：**COO 找到 CEO 判据的洞 → CEO 改判 → 我落盘**（2026-09-15）。**编号由本文件唯一写者分配**。
#
# ## 洞在哪（**"全历史"其实只是"全可达"**）
# ```
# 我们曾报「全历史复核 610 文件 / 敏感形态 0」—— ★ **但那是 `git log --all`，它【只看 refs】**
# 实测：本仓 **amend 过 3 次** ⇒ `git fsck --lost-found` ⇒ **10 个悬空对象**
#   ⇒ 全对象库 `cat-file --batch-all-objects` = **795 对象**（HEAD 闭包只有 **762**）
#   ⇒ ★ **差额 33**（含 reflog 保护的 23 个）—— 而 `push` 后这些**会随 pack 一起上公网**
# ```
#
# ## 四层判据（**每层查不同阶段，缺一层就有盲区**）
# ```
# ① `git diff --cached`                ⇒ **待提交**（index）
# ② `git ls-tree -r HEAD`              ⇒ **已提交**（落历史）
# ③ `git cat-file --batch-all-objects` + `reachable` 分级 ⇒ **全对象库**（含悬空/amend 掉的）
#     ★ 分级：`reachable=true` 的真数据 ⇒ **阻塞**（会被 push 带走）
#             `reachable=false` ⇒ **仍需为 0，但不是"已泄露"**
#     ⇒ 一句话：**`reachable` ≠ `published`**
# ④ ★★ `git clone --no-local <repo> <跨卷 tmp>` ⇒ **直接看"会被带走的那批"**（**最硬**）
#     判据：**克隆体对象数 == HEAD 闭包数** · **克隆体里真数据形态 = 0**
#     ⇒ 它**不依赖"我对 push 语义的理解"** —— **它直接跑了一次"发布"**
# ⑤ 发布前清对象库（**先备 `.git` 到仓外**）
#     ★★ **实测修正（2026-09-15）：单跑 `gc` 清不干净 —— 必须两步，顺序不能反**
#     ```
#     第一版写的是单跑 `git gc --prune=now` ⇒ 判据"悬空=0"
#     实测（本仓第一次 gc）：⇒ **悬空 = 3**（`dangling commit 742a79c / 945a618 / 4aac93b`）
#       ⇒ ★ 根因：**`gc --prune=now` 不 expire reflog**，
#         而那 3 个 commit 正是 **reflog 里 HEAD@{1..3} 的 amend 旧版本** ⇒ **仍被 reflog 引用**
#         ⇒ "有引用" ⇒ **不 prune** ⇒ **复跑 gc 仍是 3**（再跑也没用）
#     ⇒ 正确序列：
#       ① `git reflog expire --expire=now --all`
#       ② `git gc --prune=now`
#       判据：`git fsck --lost-found` 悬空 = 0
#     本仓实测：expire+gc ⇒ **悬空 0** · 对象 **795 → 762**（**正好 == HEAD 闭包**）
#     ```
#     ⚠️ **这条同时实测印证了下面那句**："`gc` 会清掉 reflog 保护的" ——
#       当时是**推断**，现在是**读数**：**它确实要先 expire reflog 才清得掉**。
#     ⚠️ **而 expire reflog = 放弃"回滚旧提交"的能力** ⇒ 与 gc 同一前提：**【无共享历史】**
# ⑥ ⚠️ **`gc`/`expire` 之后必须复跑一次"变异测试不污染主仓"**（确认机制不受影响）
#     判据：跑两次 ⇒ 主仓对象总数**不变** · `fsck` 悬空 **仍为 0**
# ```
# ⚠️ **判据自身的 bug（我实测踩到，两条都是"假 FAIL"）**：
# ```
# · 用 `git count-objects -v` 的 `count:`（**只算松散对象**）当"对象总数"
#   ⇒ **gc 后 `count: 0`**（对象全进 pack）⇒ 判据 `>0` 为假 ⇒ **假 FAIL**（主仓其实没变）
#   ⇒ 正解：**总数 = 松散 `count` + `in-pack`**
# · 而 `git count-objects -v` 的输出是 **`count: 762`（无引号）** —— 写成 `"count":` ⇒ 匹配不到 ⇒ 恒 0
# ⇒ ★ **教训**：**判据写错，两个方向都会骗人**（假 FAIL 与假绿对称）
#   ⇒ 修判据时**先确认"我量的那个数，在我期望的变化前后会不会变口径"**
# ```
# ⚠️ **第 ④ 层的实施口径（不是细节，是会失败的点）**：
# ```
# · `git clone --local` ⇒ 走**硬链接** ⇒ **跨卷（TEMP 在 C: / 仓在 D:）必失败**：
#   `fatal: failed to create link …: Improper link`
#   ⇒ **用 `--no-local`**（或 `--no-hardlinks`）或把 tmp 放**同卷**
#   ⇒ ★ **统一口径记 `--no-local`** —— 两写法效果相同，但**只有一个在跨卷下不会失败**
# · ★ **克隆失败 ⇒ 必须 exit≠0 且写明**（fail-closed）
#   —— 否则"包在 try 里"会变成「**测试被跳过而显示通过**」（**最坏形态：假绿**）
# · ★★ **克隆后必须把"工作区那份待测代码"带进克隆** ——
#   因为 `git clone` **只带已提交内容** ⇒ **未提交的修复不在克隆里**
#   ⇒ 否则测的是**上一个版本**（**可能假绿、也可能假 FAIL**）
#   ⇒ 现场（实测）：克隆里跑了 **HEAD 的旧闸** ⇒ 对真仓报假阳性 ⇒ "**修好了却报红**"
# ```

# ## ★★ 长期修复：**变异测试不许污染主仓**（比 `gc` 要紧）
# ```
# 现场：为证明"发布闸会拦"，变异测试要 `git add -f` 假敏感件 ⇒ 跑完 `git rm --cached`
#   ⇒ ✅ index 撤干净了 ⇒ ❌ ★ **但 `git add` 那一刻 blob 已写进【主仓】`.git/objects`**；
#      `rm --cached` **只移索引条目** ⇒ **blob 变悬空、永久留在对象库**，**不报错、不变红、无人知道**
#   ⇒ 而它**每次跑都发生**（"两份实现"是一次性的，这个不是）
# ⇒ **正解 = 在临时克隆里跑**（`git clone --no-local` ⇒ **主仓对象库一个字节都不写**）
#   **判据：连跑两次变异测试 ⇒ 主仓 `fsck --lost-found` 悬空数【不变】**
#   ⇒ 这是**机制 > 自觉**：不依赖"有人记得跑 gc"
# ```
# ## 顺序（**先治本，再治标**）
# ```
# 根治（克隆里跑）→ 验证（连跑两次主仓不变）→ `gc --prune=now` 清存量 → 第 ④ 层克隆复验
#   ⇒ 理由：**`gc` 是一次性动作**，而**变异测试每跑一次就污染一次** ⇒ 先 gc 等于白做
# ```
# ⚠️ **`gc` 的边界（防照抄到别的仓）**：**"gc 不破坏"的前提 = 【无共享历史】**
#   ⇒ 判据：**跑 gc 前先问"有没有人已经基于这份历史干过事"**
#     （若已有 remote / 别人已 clone ⇒ **那时它才真会改历史**）
#
