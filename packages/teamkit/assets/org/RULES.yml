# ★★★ 【R15】**复盘必须有一栏「减少人工动作」** —— 且 **只机械化【存在性】那一半**
#
# 来源：`AI-COMPANY-FORM.md` 的 **C2**（CEO 立）+ **总工程师判可行性**（2026-09-14）——
#   CEO 原话：「**请你判**：C2 能不能做成一条机械断言？（**别迁就我**）」
#
# ## C2 要拦的**真实事故**（**实测，就发生在它诞生的那个复盘里**）
# ```
# 扫两份 `runs/005-role-skills/INCIDENT-*.md`：
#   grep「减少人工|减负|删掉.*规矩|机器替|省一步」⇒ **0 处**
# 逐条归类 P0 报告的 A1–A5：
#   A1 Add 断言 / A2 Change RULES.yml / A4 Update 报告 = **加约束或加内容**
#   A3 Deploy 缓存处置 / A5 Test 真重启复读         = **一次性动作**（不减**后续**人工）
#   ⇒ **"加约束 5 条 / 减负担 0 条"**
# ⇒ 结论：C2 **不是"还没生效"，是"从来没生效"**（一条纪律在它诞生的复盘里就没被遵守）。
# ```
#
# ## 判定：**双要素分开标**（`R14` 的应用）
# ```
# ✅ **存在性那半 = 机制**（可机械核，已落 `H50`）：
#    每份 `INCIDENT-*.md` 必须① 有「减少人工动作」一节 ② 非空 ③ 内含**依据指针**
#      （`文件:行号` / 原始返回 / 显式「未获取」/「本轮无」）
# ❌ **语义那半 = 备忘，不许说成机制**：
#    "那条动作**真的**减负" 要**理解上下文** ⇒ grep 做不到；硬做只能上关键词表
#      （`删|自动|机器`）⇒ **一句话就能骗过**（"部署了自动删除所有约束的脚本"）⇒ **判据通胀**。
# ```
#
# ## ⚠️ 两条**防坑**（写进 `H50` 注释里，且**不许被"加强"掉**）
# ```
# ① **允许如实写「本轮无」**（现场：允许写"本次事故根因是新增约束，故无减负"）
#    ⇒ 否则会**逼人编一个假减负** —— 而"编"比"没有"更坏（本项目最忌假事实）。
# ② **不许做成数量指标**（"减负 ≥ 1 条"）= **指标式合规**（`H43`/`H44` 同族：造数字去满足数）。
# ```
#
# ## 判据现状
# ```
# · `H50` 已落并**变异测试过**（缺节 / 标题改掉 / 真正清空 / 有内容但无指针；另用临时报告验空节）
# · ★ **上线首跑就报红两份真报告** ⇒ 已补齐（每条带可核指针）
# · ⚠️ 补的那两份里保留了**两条"没减掉"的诚实边界**：
#     本次最该减的动作（**"CEO 越权动手"仍靠纪律文本拦**）**没有减掉**
#     ⇒ 如实标 `⬜ 未获取`，**不许写成"已经减了"**
# ```
#
# ## ★ 同族（`R13` 家族：`"看起来成立"` vs `"真的成立"`）
# ```
# C2 的"备忘→机制"这一步，正是 `R13` 的现场正例：
#   既有信号（`selftest` 的 `H` 组）已经在跑 ⇒ **不造第二套**，而是**加一条同形断言**（复用 `H49` ③ 的扫分节做法）。
# ```
