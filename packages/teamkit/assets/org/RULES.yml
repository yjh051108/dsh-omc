#   · **起止时刻**（HH:MM:SS）
#   · **预期持续多久**
# 位置：`notes/` 或**任务描述**（**共享可读**，**不是私人上下文**）
# ```
# **判据**：
# ```
# **任何并发读者在切换窗口内读盘，都能知道"这不是稳态"**。
# ```
#
# ## ★ 为什么不合并进 `R26`（**我判：新号，不合并**）
# ```
# `product-director` 建议「作为 `R26` 的一条补充」，理由是"**时刻也是读数的命名空间**"。
