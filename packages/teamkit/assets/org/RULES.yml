# ★★★ 【R30】**引用纪律**：抄逐字 + **长行必须标截断状态**
#
# 来源：**COO 提出 + CEO 现场两例各栽一半**（2026-09-15）。**编号由本文件唯一写者分配**。
#
# ## 现场（**一轮白花，两人各错一半 —— 所以规则必须两项都有**）
# ```
# ① COO 引 `:454` **只给行号、没抄内容** ⇒ CEO 核到时查的是**另一个位置的 `:454`**
#    ⇒ **双方都以为对方错**（报告白花一轮）
# ② CEO 引 `:454` 时**读到的是 129 字符行的前 96 字符**，当成完整行
#    ⇒ 据此断言"这行没有 inactive" ⇒ **结论反转**
# ⇒ ★ **实测（我复核）**：那行**全长 129 字符**，而 `"inactive"` 恰在**被截掉的那一段里**：
#    `status: member.phase === "failed" ? "failed" : member.phase === "provisioning" ? "provisioning"
#     : live?.status ?? **"inactive"**`
#    ⇒ **"半行"看起来完全像一个完整引用**（有行号、有内容、语法完整）⇒ **这才是它危险的地方**。
# ```
#
# ## 规矩（**最终形态，四项，只写一项都防不住本次**）
# ```
# ① **必须抄逐字内容**（只给行号 ⇒ 对方无法核"你引的是哪一处"）
# ② ★ **长行必须标截断状态**：>80 字符的行 ⇒ **要么整行抄完，要么显式写"（截断，全长 N 字符）"**
#      ⇒ **不许把"半行"当"完整行"**
# ③ **同文件有多处相似行 ⇒ 给「函数名 + 行号 + 逐字内容」三者**
# ④ **机械可查**：**引用内容长度 ≈ 源行长度**（或已标截断）
# ```
# **一句话**：**"抄了一段内容" ≠ "抄的是完整那行"**。
#
# ## 它管的方向（**与 `R23`/`R26` 分工**）
# ```
# `R23` 要**产物**（别人能不能用你的产物算一遍）· `R26` 要**产物有主**（谁跑的）
# ⇒ 本条管**"引用的那一段是否完整"** —— **对象是【引用的保真度】**，与前两条不同。
# ```
#
# ## 判据现状（`R14`）
# ```
