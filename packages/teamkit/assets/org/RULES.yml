# ★★★ 【R21】**"能 parse" ≠ "能跑"** —— CLI 冒烟必须真跑一次子命令
#
# 来源：`plugin-smith` 在 `task-99` 交活后报的真 bug + **它提出的判据**（2026-09-14）。
#
# ## 现场（**命令看起来成功，但结果是错的**）
# ```
# $ teamkit preset-new cli-team --template lite
# ✅ 生成预设 `preset-new`          ← ★ **预设名变成了子命令名**，而 **exit=0**（"成功"）
# 根因：`parseArgs` 取"第一个非 `--` 参数"当名字 ⇒ 经 bin 转发时 `argv[2]==='preset-new'` 被吞
# ⇒ **`node --check` 查不出这类**（语法完全合法）⇒ **`selftest` 也不一定查得出**
# ```
#
# ## 规矩
# ```
# ① **`node --check` 只能证明"能 parse"，不能证明"能跑"** ——
#    凡**新增/改动 CLI 子命令**，必须**真跑一次**（`--help` / dry-run / 最小正例）。
# ② 判据（可机械）：**每个子命令至少被真调用一次** ⇒ 断言"不崩 + 退出码在预期集合内 + 关键输出含预期 token"。
