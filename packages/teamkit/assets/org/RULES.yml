# ## ★★ 为什么不能只做一条 `selftest` 断言（**这是本条的核心**）
# ```
# `selftest` 挂在 `teamkit.mjs` 里 ⇒ **它自己语法崩了就根本起不来** ⇒ 断言**跑不到**。
# ⇒ **"自测入口自身"必须由【外部】查** ⇒ 这是"独立入口"的准确含义。
# ```
#
# ## 规矩
# ```
# ① `tools/check-all.mjs` **第一步**跑 `node --check`：
#    覆盖 `plugin/{bin,lib,scripts,tools}/**/*.{js,mjs}`（**含 `teamkit.mjs` 自身**）
# ② 语法坏 ⇒ **立刻 `exit=1`**，只报「CLI 语法坏了」+ 坏文件行 + 一句常见原因；
#    **不许继续跑校验器**（防假红误导）
# ③ 判据：**造一个语法坏 ⇒ 立刻停 + `exit=1` + 输出里【不出现】任何校验器名字**（变异测试已证）
# ```
# ⚠️ **补充边界（`R5`：不许升格）**：`H51`（`selftest` 内那条）只覆盖**被 import 的件**
#   （`lib`/`scripts`/`tools`）—— **它查不了 `teamkit.mjs` 自身**；
#   查入口自身**靠 `check-all` 的前置段**（独立入口）。**两者是互补的，别把 `H51` 说成全覆盖。**
#
# ## ★ 这条最值得记住的一课（CEO 特别点名）
# ```
# **"知道有坑"不构成防护。**
# 总工程师在 22:38 因这个坑崩过一次；22:45 **他在写"防这个坑的 `H51`"时又踩了同一个坑**。
# ⇒ 所以正解**不是"下次注意"**，而是 `H51` + `check-all` 前置段 —— **它们不依赖"我记得"。**
# ⇒ 归入 `R13` 家族（`"看起来成立"` vs `"真的成立"`）：**"我知道" ≠ "我被挡住了"。**
# ```
