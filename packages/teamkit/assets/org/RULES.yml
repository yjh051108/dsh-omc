#      它的动作是"**切换前声明**"。**两者的补救动作不同** ⇒ 合并会让一条失去指向（`R14` 家族）。
#   ② 本项目已有先例：**方向/动作不同的两条不合并**（`R24` vs `R27` 就是这么处理的）。
# ⇒ **但补一条交叉引用**（让读者知道它们相邻）：
#    `R26`（分配权）· 本条（时刻）· `R19`（会变的数要带时刻）⇒ **三条合起来才是"读数的完整身份"**
# ```
