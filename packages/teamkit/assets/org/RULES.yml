# ★★★ 【R27】**"事件为空"要先证"该系统会记这类事件"**（反证法的前置）
#
# 来源：`task-108` 的真实用法 + COO 提炼（2026-09-14）。**编号由本文件唯一写者分配**。
#
# ## 它与「读不到 ≠ 没有」（`R24`）**是一对，单有一条都是半截**
# ```
# · `R24`（已有）：防「**把"读不到"当"没有"**」   —— 假绿方向
# · 本条   （新）：防「**把"没有"当"读不到"**」   —— 反方向的辩解
# ⇒ ★ **两条合起来才完整**：一条防"读不到当没有"，一条防"没有当读不到"。
# ```
#
# ## 规矩
# ```
# 要用"某事件【没发生】/ 日志里【一条都没有】"去支持结论 ⇒
#   **必须先证"这个系统在发生这类事件时【确实会记】"**（拿出**历史上真记过的样本**）。
# 证不出 ⇒ **不许**用"空"来支持任何结论 ⇒ 只能写「**未获取**」。
# ```
# **现场（真实读数，来自 `task-108`）**：
# ```
# 证"**内存压力不是退出原因**"时用的正是这条：
#   `Resource-Exhaustion-Detector` 全量 **3 条、全在 2026-08-21**；**9-14 的 = 0 条**
#   ★ 而 **8-21 记过 ⇒ 说明"会记"** ⇒ **9-14 没记 = "没发生"，不是"没配置"**
# ⇒ ★ 它堵住了"事件为空"最常见的辩解：「可能是没开这个日志」。
# ```
# **判据（可机械核，形状由实现定）**：
# ```
# 任何"用空集支持结论"的断言 ⇒ 必须同时给出**一份非空的历史样本**（证"会记"）；
#   给不出 ⇒ 该结论**降级为「未获取」**。
# ```
# ⚠️ **本条与 `R24` 同族**（都是"读不到 vs 空"），**但方向相反** —— 所以**不许合并成一条**。
#
# ## 判据现状（`R14`）
# ```
# ⬜ **无自动断言** ⇒ **备忘**。（"有没有拿历史样本证会记"很难机械判定）
# ```
#
# **归口**：`engineering-director`。

