# ★★★ 【R24】**"读不到" 与 "读到了空" 是两件事** —— 必须 fail-closed，不许退化成空集合
#
# 来源：`e2r-landing` 在 `task-106` B 段**自己抓到**的真 bug（2026-09-14），
#   与它/COO 各自独立发现的 `journal.phase` 问题**构成一对**。
#
# ## 现场（**一对假读数，同源**）
# ```
# ① 假绿：`journal.state(root).members[].phase === 'active'`
#    ⇒ `phase` 是**写入时的快照**，进程死了**不会自己变** ⇒ 22/22 全 active
#    ⇒ 算出 **0 孤儿** ⇒ 结论"**一切正常**" —— **而实际有 10+ 个孤儿**
#
# ② 假红：`const names = agents?.list?.() ?? []`
#    ⇒ `agents === undefined` 时 **不抛**，返回**空数组** ⇒ `ok: true` + 空集合
#    ⇒ 下游把**每一条 in_progress 都判成孤儿** ⇒ 结论"**到处都坏了**"
# ```
# ⇒ ★★ **两者同源**：**把"读不到"当成了"读到了（空 / 活跃）"**
#   ⇒ 一个往"正常"偏（假绿），一个往"坏"偏（假红）——
#     **方向相反，病因相同。**
#
# ## 规矩
# ```
# 任何"**取外部服务 → 据此算结论**"的地方：
#   · **服务缺失 / 读失败** ⇒ **必须 fail-closed**：返回 `ok:false` 或 `exit=2`，并**明写「未获取」**；
#   · **不许**用"空数组 / 默认值 / 上一轮的值"继续算下去 —— 那会产出一个**看起来像结论的假值**。
# ```
# **判据（可机械核，形状由实现定）**：
# ```
# 造"服务缺失"（例：`agents === undefined`）⇒ 输出必须是**未获取**（exit=2），
#   **不许**是"0 孤儿"、也**不许**是"全是孤儿"。
# ```
#
# ## ★ 为什么语法断言拦不住它（`e2r-landing` 的原话，逐字收录）
# ```
# 「`node --check` 查不出（**语法完全合法**），**只有真跑 + 想清"空集合意味着什么"才现形**。」
# ⇒ 所以：**这条判据必须建在"行为"上，不能建在"字面上"**（`R21` 同族：能 parse ≠ 能跑）。
# ```
#
# ## 同族
# ```
# `R13`（"看起来成立" vs "真的成立"）· `R21`（能 parse ≠ 能跑）
# · `H49`（README 假信息）· `R5`（结论不许超出读数）
# ⇒ **共同形态**：**一个"像结论"的值，被当成了结论。**
# ```
#
# ## 判据现状（`R14`）
# ```
# ✅ **已有实测覆盖**（`task-106` B 段）：
#    `OK [B] ★★ 活跃度来源 fail-closed：拿不到 agents ⇒ ok:false（不许退化成空集合）`
#   ⇒ 那是**针对那一处**的机制；**尚未**做成跨模块的通用断言。
#   ⇒ 就全局而言：**本条是"部分机制 + 备忘"** ⇒ **不许说成"全项目已强制"**。
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R25】依赖"运行时前置条件"的判据，**必须自带前置检查**
#
# 来源：**CEO 规格 + COO 转达**（2026-09-14）。**编号由本文件唯一写者分配**（见文末【维护纪律】）。
#
# ## 规矩（规格逐条，不改）
# ```
# · 判据执行前**先检查它的前置条件**是否成立；
# · **前置不成立** ⇒ 输出「**前置不成立**」（**独立状态**），**不报 FAIL**；
# · 判据：造一个"前置不成立"的场景 ⇒ 必须是「**前置不成立**」，**不是 FAIL**（贴原始输出）；
# · **反例（必须能红）**：**前置成立但真坏了** ⇒ **必须报 FAIL**
#   —— **不许**用"前置不成立"掩盖真失败（否则它就成了新的"假绿"出口）。
# ```
#
# ## 我们的账（为什么需要它）
# ```
# `verify-task61` 会**周期性假红** —— 而假红会**误导人去修没坏的东西**
#   （与 `R16` 那 5 条连带假 FAIL 同族：**假红和假绿一样贵**）。
# ⇒ ★ 一句话：**"前置不成立"不是失败，但"用前置不成立掩盖失败"是**。
# ```
#
# ## 三态（与判据体系对齐）
# ```
# ✅ PASS（前置成立 + 真通过）
# 🚫 FAIL（前置成立 + **真坏了**）           ← **不许降级成"前置不成立"**
# ⬜ 前置不成立（**独立状态**，不算红也不算绿） ← 本条新增的那一档
# ```
#
# ## 判据现状（`R14`：不许冒充机制）
# ```
# ⬜ **无跨项目的自动断言** ⇒ 就全局而言**标"备忘"**。
#   ⇒ 逐处落地时，**每处要有自己的"前置不成立"变异测试**（造前置不成立 ⇒ 必须不是 FAIL）。
# ```
#
# **归口**：`engineering-director`。

# ══════════════════════════════════════════════════════════════════════════════
# 【维护纪律】三条 —— **编号分配 / 谁被约束 / 维护节**（`R14`：全部标"备忘"）
# ══════════════════════════════════════════════════════════════════════════════
#
# 来源：**CEO 本轮两次自认 + COO 第四次守边界**（2026-09-14）。
#
# ## ① 【编号必须由本文件唯一写者分配】
# ```
# · 现状：**`engineering-director` 是本文件唯一写者** ⇒ **编号由它统一分配**
# · 提交者只写「**内容 + 约束谁**」，**不指定编号**（指定了就要撞号）
# ⚠️ **本条的现场（同一件事一天两次）**：
#   · CEO 口头给 `R22` ⇒ 与已占的【R22 派活负边界】冲突
#   · 它改成 `R24` ⇒ **又与已占的【R24 fail-closed】冲突**（第一条的教训**当场复发**）
#   ⇒ ★ 这说明：**"知道要避免" 不等于 "避免掉了"**（`R13` 家族）
#   ⇒ 正确形态：**编号只由写者分配**，提交者**不碰编号**。
# ⚠️ **无断言可红**（撞号要到写盘才暴露）⇒ **按 `R14` 标「备忘」**。
# ```
#
# ## ② 【每条纪律必须写清"它约束谁"】
# ```
# 依据（COO 挑出的区分）：**CEO 犯的是"转述合并"，不是"读数不带时刻"** ——
#   **两条纪律指向不同的人**；不写"谁"就会出现「用 A 的纪律去记 B 的违规」。
# 取值（四类，按本项目实际出现的角色）：
#   · **报数者**（给读数的人 / 取现场的人）
#   · **转述者**（把别人的话合并/搬运的人）★ 这一类最容易被漏
#   · **执行者**（动手改的人）
#   · **裁决者**（下判断/批的人）
# ⇒ 新纪律由提交者写「内容 + 约束谁」；**若本文件某条没有这一栏 ⇒ 那是欠账**（存量允许未补）。
# ⚠️ **无断言** ⇒ 标「备忘」。
# ```
#
# ## ③ 【修订本文件的两条操作纪律】
# ```
# · 改【仓根 `RULES.yml`】⇒ **必须** `node plugin/scripts/sync-assets.mjs`（否则 `sync-assets --check` FAIL）
# · 改【`plugin/lib/**`】⇒ **必须** `dev_reload_package`（否则跑的是旧代码）
# ⇒ 这两条**已有机械拦截**（`sync-assets --check` / `H29` 家族）⇒ **算机制**（不是备忘）。
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R26】凡"**共享命名空间**"⇒ 必须有**唯一分配者**
#
# 来源：**CEO 给出内容 + 三种形态归族**（2026-09-14）。
#   ⚠️ **提交者不预分配编号**（按【维护纪律①】）—— CEO 本次**明确只给内容不给号**（它前两次给号都错了）。
