# ★★★ 【R18】**排障先问"这件事属于哪一层，那一层的日志在哪"**
#
# 来源：**总工程师现场找到、CEO 采纳并升格为通用教训**（2026-09-14 / `task-106` A 段）。
#
# ## 它是怎么被发现的
# ```
# CEO 猜「大量 hot reload ⇒ 宿主重启」；我核出：热重载 251 次（p50 0.02s）vs 进程重启 3 次（~19s）
#   ⇒ 量级差 100 倍、时间不对齐 ⇒ 假设不成立。
# ★ 真正的原因之一是：**我们在用【错的日志】解释现象** ——
#      `stateDir/teamkit.log` 只能看到"**插件被重载**"，
#      而"**进程为什么死**"记在**壳自己的日志**里（`D:\dsh\desktop\web.log`）
#   ⇒ **换了日志，才看到 `code=130` / `restarting in 800ms` / 锁超时那几行原文。**
# ```
#
# ## 规矩
# ```
# 排障时**先回答一句**：**"我这次读的是哪一层的日志？"**
#   说不出 ⇒ **可能正在用 A 层日志解释 B 层现象**（**必错**）。
# ```
# **分层对照（本项目的现场正例）**：
# ```
# · **进程为什么死**     ⇒ 壳的 `web.log`（`D:\dsh\desktop\web.log`；由 `main.js` 的 `logFile()` 定）
# · **插件被重载 / 装配** ⇒ `stateDir/teamkit.log`（我们自己的）
# · **会话里发生了什么**  ⇒ `sessions/<sid>/session.v3.jsonl.zstd`（多帧 zstd，见 `LANDMINES` §11）
# · **板/成员状态**       ⇒ `journal.state()` / 投影（**不是日志**）
# ⇒ 判据：**每条结论都能说出它读的是哪一层**；说不出 ⇒ 标「未获取」。
# ```
# ⚠️ **同族**：`R13`（先找既有信号）—— 本条是它在**排障场景**下的特例：
#   **"既有信号"可能不在你正看着的那份文件里。**
#
# **归口**：`engineering-director`。

