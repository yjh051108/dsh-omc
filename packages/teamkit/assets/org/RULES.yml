# ★★★ 【R14】**每条纪律要么带断言 id，要么显式标「备忘」**（与 `R9` 同族，合并成一条口径）
#
# 来源：COO 出判据 + CEO 批 + 总工程师落盘（2026-09-14）。
# **CEO 原话**：「它比我写的所有纪律都值钱」。
