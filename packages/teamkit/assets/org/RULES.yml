# ★★★ 【R12】**验证不许碰用户真机目录 —— 优先 fakeHome / 临时目录**
#
# 来源：**CEO 现场指出**（2026-09-14）—— 我的判据脚本 `verify-check-coverage.mjs`
#   把 `.verifycheck-bak` **留在了用户的真机预设目录**（`$DSH_HOME/.agent-presets/omc/`）。
#   ⇒ 我删了残留 + 修了脚本（`restoreAll` 加 `rmSync(b.bak)`），**但流程本身错了**。
#
# **为什么它属于"底线"那一族**（`R4`：我们的生产 vs 用户正在用的宿主）：
# ```
# · `$DSH_HOME/**`（`.agent-presets` / `.teamkit` / `sessions` / `settings.yaml`）
#   = **用户正在用的环境** ⇒ 我们有**建议权**，**不是处置权**
# · 而**仓内验证**（写我们自己的目录再清掉）是**我们的生产** ⇒ 随便动
# ⇒ 两者混起来 = **拿用户的房子当试验场**（哪怕这次零损失）。
# ```
# **规矩**：
# ```
# ① 验证脚本**默认**用 **fakeHome / 临时目录**（`DSH_HOME=<tmp>`）⇒ 与用户环境隔离
# ② 确需对**真机**验证 ⇒ **只读**（读、比对、报读数）；**要写 ⇒ 先报 + 逐项列写入清单**（`D-9` 换路判据）
