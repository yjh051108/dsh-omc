# **"悬空"有两个含义，报数必须写清哪个**：
#   · `git fsck --lost-found` ⇒ "**无任何引用**" = 10
#   · `全对象 795 − HEAD 闭包 762` ⇒ "**HEAD 之外的所有**" = 33（**含 reflog 可达的 23**）
#   ⇒ 两个数都真、口径不同 ⇒ **报"悬空"时要说清**
# ```
