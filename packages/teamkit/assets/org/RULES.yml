#   行内容： ? `${targets.length} 个全部可 parse ✓（⚠️ 本条查不了 `teamkit.mjs` 自身 —— 见注释）`
#   ⇒ **模板字符串里嵌了 Markdown 反引号** ⇒ 整个 CLI 跑不起来
# ```
# **两个后果，第二个更危险**：
# ```
# ① `selftest` 返回**空**（自测工具本身挂了 ⇒ **没人知道自己坏了** —— 这是**元级别的坏**）
