# ④ 判据（可机械核）：验证脚本结束后的 `$DSH_HOME` 目录清单 === 开始前那份
#    （多一个文件 ⇒ 判"留垃圾"）
# ```
# ⚠️ **本条的现场教训**：我不是"忘了删"——是 **`restoreAll` 只还原内容、不删备份**（设计缺口）。
#   ⇒ 与 `R2` 同族：**"我做了还原" ≠ "回读证明已还原"**（连"文件在不在"都要查）。
