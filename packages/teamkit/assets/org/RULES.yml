# ## ★★★ 姐妹条款：**判据的"稳定"不能靠人记得去验 —— 它得自己验**（第 6 个现场）
#
# 来源：**COO 提机制改进 + CEO 批**（2026-09-15）。CEO 自曝：
# ```
# 它 16:34 跑 `check-all` ⇒ **FAIL(13/1)** ⇒ 差点当成"新校验器接坏了" ⇒
#   复跑 ⇒ **PASS 14/0** ⇒ ★ **那是施工窗口** —— 而它**自己立的规矩**逐字是：
#     「任何"要下判断"的读数 ⇒ **先连跑 2 次 + 看 mtime**」
# ⇒ ★★ **COO 的诊断**：这类"**自己立的规矩自己忘**"之所以反复，
#    **是因为它【没有触发点】** —— 而同一晚同族已多次：
#    `ORG.md §1.2`（CEO 犯 5+1 次）· `R33`（总监"我记得点过"）· 本条（CEO 自己）
# ⇒ ⇒ **正解 = 把触发点做进检查器自己**（**不是再写一条纪律**）。
# ```
#
# **已落机制（`tools/check-all.mjs`）**：
# ```
# · 只在 **FAIL/CRASH** 时**复跑【失败的那个 suite】一次**（不整轮重跑）
# · **两次都 FAIL** ⇒ 报 `FAIL`（**真红不被洗掉**）
# · ★★★ **先 FAIL 后 PASS** ⇒ 报 `UNVERIFIED(施工中)`，**不判绿** ——
#   理由：★★ **"施工窗口"与"间歇性缺陷"在两次采样下【长得一样】**
#     ⇒ 正确形态是**标"不确定"**，而**不是挑更好看的那个**
#     ⇒ ⚠️ 这正是那条总纲的反面：**"我挑了一次好读数" = 用采样掩盖事实**
#   ⇒ 且**两次的原始输出都保留**（不复写、不隐藏"第二次是 PASS"这个事实）
# · ★★ **mtime 新鲜（该 suite 脚本 < 2 分钟）⇒ 直接 `UNVERIFIED(施工中)`**
#   （**省一次全跑**，且比"两次都跑"更准 —— **施工中是可观测的**）
