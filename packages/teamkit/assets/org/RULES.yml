# **归口**：`engineering-director`。

# ★★★ 【R16】**自测入口自身必须由【外部】查** —— 语法坏 ⇒ 立刻停，不许报连带假红
#
# 来源：**同一坑 3 次**（`docs-writer` 的 `task-57` / 总工程师 `H50` / 总工程师 `H51`）
#   + **CEO 现场裁定**（2026-09-14）。
