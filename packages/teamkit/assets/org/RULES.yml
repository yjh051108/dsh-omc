# ★★★ 【R29】**版本互切期间，必须在共享可读位置声明"正在切换"**
#
# 来源：**`panel-fixer` 实测 + `product-director` 提出 + CEO 批方向**（2026-09-15）。
#   **编号由本文件唯一写者分配**（提交者只给内容 —— 它做到了，**没有预分配编号**）。
#
# ## 现场（**真实发生过，差一点报错结论**）
# ```
# `panel-fixer` 在做 A/B 对照：
#   16:29:51Z 抓"改后"快照（live = `adbd6b404fb8789f`）
#   16:30:10Z **主动切到改前版** `5831ea2144931503`（做字段 diff 的 A 臂）
#   16:30:30Z 抓"改前"快照
#   16:31:05Z 切回 `adbd6b40`
# ⇒ ★ `product-director` 在 **00:31:03** 读了盘（落在那 **55 秒**窗口内）
#   ⇒ 读到 `5831ea21` ⇒ **差点报成"回退了"**
#   ⇒ ★ 它是**把它当疑点先问、没当结论报** ⇒ **"是运气好，不是制度好"**（它的原话）
