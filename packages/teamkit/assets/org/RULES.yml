# ★★★ 【R36】**"装没装对"不能用 mtime 判** —— 要用「内容 + 读得到 + 字段非空」三件
#
# 来源：**CEO 实测 + 我复核**（2026-09-15）。**编号由本文件唯一写者分配**。
#
# ## 现场（**两个方向都会错**）
# ```
# ① 安装器用 `cpSync`（Windows `CopyFileEx`）⇒ **继承源文件的 mtime**
#    ⇒ 装完之后，**真机文件 mtime = 源 mtime** ⇒ **完全看不出"什么时候装的"**
# ② CEO 上一轮据此报：「真机 roles 全部 `duties=0` · mtime **09-13 23:36** · 无 `director.json`」
#      ⇒ ★ 那个读数**是对的**（当时**源文件本身就是旧版** ⇒ 装出来自然是旧版）
#    ✅ 随后一次重装 ⇒ 真机目录 mtime **13:58:13** ⇒ 装进了新版（源 mtime 01:11:21）
#    ⇒ ★★ **"我报了缺口" 与 "它已被修" 同时成立** —— **差别只在时刻**（`R19`）
# ⇒ ⚠️ **所以 mtime 既不能说"装过"、也不能说"没装"** —— 它**跟源走，不跟动作走**
# ```
#
# ## 规矩（**三条，缺一不可**）
# ```
# 判"装没装对" ⇒ 必须同时给：
#   ① **内容**：与源**逐字节 sha 比对**（★ **不能用 mtime**）
#   ② **读得到**：用**真代码**读（例 `loadRoles` + `personaFor`）⇒ **贴实际输出片段**
#   ③ **字段/条数**：关键字段非空（例 `duties`/`boundaries` 条数 > 0）
# ```
# **判据（可机械核）**：
# ```
# 任何"已安装 / 未安装 / 装的是新版"的结论 ⇒ **必须附 sha 或内容比对**；
#   只给 mtime / 只给"文件存在" ⇒ **不算读数**
# ```
# ⚠️ **与 `R24` 的关系**：`R24` 说"读不到 ≠ 读到了空"；本条说 **"时间戳 ≠ 内容"** —— **同族（判据取错量）**。
#
# ## 现场处置（本条诞生当轮就做了）
# ```
# · 安装器已重跑 ⇒ 真机 8 份与源**逐字节一致**（含 `director.json`）
# · `H53` 已补第 ④ 条：核 `$DSH_HOME/teamkit/roles`（**内容比对，不比 mtime**）
#   且 `DSH_HOME` 取不到 ⇒ **`UNV`（未获取）**，**不判红**（`R12`：不绑死真机路径）
# · 端到端实测：`loadRoles(真机)` ⇒ `readable=true · n=8 · skipped=0`；
#   `personaFor(chief)` ⇒ 含「你该做什么（职责）」与「你不该做什么（边界）」+ **每条带 `依据：`** ✅
# · 变异测试：把真机 `chief.json` 的 `duties`/`boundaries` 删掉 ⇒ `H53` **报红** ⇒ 还原后复绿 ✅
# ```
#
# ## 判据现状（`R14`）
# ```
# ✅ **已机械化**：`H53` 第 ④ 条（发货态内容比对）· `tools/verify-shipped-roles.mjs`（用户视角总校验）
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R37】**共享工作区里提交 ⇒ 不许 `git add -A`** —— 「我辖区 ∪ 已确认完成」才该 add
#
# 来源：**我自己的真事故 + CEO 的定性更正**（2026-09-15）。**编号由本文件唯一写者分配**。
#
# ## 现场（**一次 `git add -A` 把 5 个"不属于我辖区"的文件一起固化**）
# ```
# 我提交 `023b333`（14:31:49）时用了 **`git add -A`** ⇒ 16 个文件里 **5 个不是我辖区的**：
#   · **Lead 的 3 个**：`runs/006-productivity/CEO-NOTES.md` · `OPEN-SOURCE-READY.md` · `ROUND-16-CLOSING.md`
#   · **COO 的 2 个**：`notes/coo/COORDINATION-LEDGER.md` · `notes/coo/coo-git-objects-scan.mjs`
# ★★ 而 **`CEO-NOTES.md` 在提交后 33 秒又被写了**（mtime 14:32:22 > 提交时刻 14:31:49）
#   ⇒ **提交里那份是旧快照** —— 而**提交者不知道**。
# ⚠️ 客观条件：当时机器上**有 ≥2 个人同时在写**
#   （我写 `teamkit.mjs`/`check-all.mjs`；`plugin-smith` 写 `plugin/lib/orphans.js`）
#   ⇒ 而 **`git add -A` 的语义是"把整个工作区当成我的"** ⇒ ★ **在共享工作区里这不成立**。
# ```
# ★★ **CEO 的定性更正（我采纳，它比我原来的写法准）**：
# ```
# 我原文写「5 个**别人**的文件」⇒ ❌ **不准确**。CEO 逐个核后指出：
#   · **卷进 Lead 的文件** ⇒ **不算越界**（**它本就是 Lead 该提交的**，只是时刻差 33 秒）
#   · ★ **卷进同级的在飞文件** ⇒ **那才是真问题**（`R12`/`D-6`：谁的东西谁处置）
# ⇒ ★ 所以**这条纪律的真正形态**不是"不许碰别人的"，
#   而是：**只 add「我辖区 ∪ 已确认完成」的**，其余留给它的 owner。
# ```
#
# ## 规矩
# ```
# 提交前：
#   ① `git status --porcelain` 的**每个文件** ⇒ **逐个标"归谁"**（按板上 task owner / 问本人）
#      ⚠️ **不许用 mtime 推断归属**（`R36`：时间戳 ≠ 内容；`R19`：会变的数要带时刻）
#   ② ★ **只 `git add`「我辖区 ∪ 已确认完成」的** —— 其余**留给它的 owner**
#      ⚠️ **Lead 的文件不算"别人的"**（它本就是 Lead 该提交的）
#      ⚠️ **不用 `git add -A` / `git add .`**（除非能证明"其余都已完成且愿意一起提交"）
#   ③ 核"有没有**别的 owner** 的文件 mtime 在最近 N 分钟内"（`R32` 的施工判定）
#      ⇒ 有 ⇒ **等它停手**（或**只 add 自己的**）
#   ④ ★★ **还要问一句「别人的工作区里有没有【测试产物 / 临时件】」**（COO 补，我采纳）：
#      ```
#      `git add -A` 的**真正危害不止"半成品被固化"**（我只说了这一半）——
#      更常见的形态是：**把别人【打算删的】临时件/调试脚本/实验数据写进历史**
#        ⇒ ① 要清就得**改历史**（不可逆） ② ★ **它们还会进对象库** ⇒
#           **正是我们刚认定的"悬空对象"污染源之一**
#      ⚠️ 而这**不能靠 owner 判断**（那些件**不会出现在板上**）⇒ **只能问本人，或按命名约定（如 `.tmp-*`）**
#      ⇒ 判据：**`git add` 前先看 `git status` 里有没有"看起来是临时件"的路径**（`.tmp-*` / `*-probe.*` / `*.bak`）
#      ```
# ```
# **判据（可机械核）**：
# ```
# 提交后 ⇒ `git show --stat HEAD` 的**每个文件都必须能说出"谁写的、为什么在我的提交里"**；
#   说不出的 ⇒ **那笔提交越界了**
# ```
# ⚠️ **与邻近纪律的关系**：
# ```
# · `R32`（施工期间的红灯 ≠ 回归）—— 本条是它在**写盘动作**上的对应物：
#   **施工期间提交 = 把中间态当完成态**；而**共享工作区里，它还多一层"把别人的中间态当我自己的"**
# · `R12` / `D-6`（谁的东西谁处置）—— **别人的文件不由我固化**（他可能有未完成的一部分）
# · `R33`（报"已落盘"要附读回命令）—— **本条要的是"提交后能逐文件交代归属"**
# ```
#
# ## 判据现状（`R14`）
# ```
# ⬜ **无自动断言** ⇒ **备忘**。
#   ⇒ 候选机械化：**提交后比 `git show --stat HEAD` 与"我这一轮改过的文件清单"** ⇒ 差集报警
#     （难点：脚本不知道"我这轮改了什么" ⇒ 需要一份声明式清单）
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R38】**要证明"判据会红"⇒ 不许改产品文件** —— 用【注入的坏输入】或【临时副本】
#
# 来源：**`plugin-smith` 的真事故（它自己判为"自锁"）**（2026-09-15）。**编号由本文件唯一写者分配**
#   （编号由它拟 `R38`，**落地由我** —— 我是本文件唯一写者）。
#
# ## 现场：一个变异测试把自己锁死了（**比"有窗口"严重一个量级**）
# ```
# 它第一版形态 = **`写坏产品文件 → 跑判据 → 改回`**（全项目当时都这么写变异测试）。
# ★★ 它**不是"有窗口"，是【自锁】**：
#   ① 某轮被打断（工具调用被外部中断）⇒ **盘上留的是变异体**
#   ② 下一轮 `readFileSync(srcPath)` 读到的"**原文**"**已经是变异体**
#   ③ ⇒ "还原" = **把变异体写回变异体** ⇒ **永远回不去**；且后续变异**全部失配**
# ⇒ CEO 现场看到的形态：**L199 好了、L271 又出现** —— ★ **同一过程的两阶段，不是两个事件**
# ⇒ ★★ **而这条同时否掉了我引 `R28` 的建议**：
#   我原本建议"把还原做成独立入口"（`R28`）——**错**：
#   自锁场景下"原文"已经丢了，**独立入口也救不回来**
#   ⇒ 正解**不是"更好地还原"，是"根本别碰产品文件"**。
# ```
#
# ## 规矩
# ```
# 要证明某个判据**会红** ⇒ 二选一：
#   ① **注入坏输入**（用命令行参数/环境把"坏样本"传进去）—— **最干净**
#   ② **在临时副本上变异**（`mkdtempSync()`）—— **产品文件全程只读**
# ❌ **不许**：`写坏产品文件 → 跑 → 改回`（**自锁风险 + 不可并发**）
# ```
# **判据（跑完必须自证）**：
# ```
# ① **产品文件 sha256 与跑前相同**
# ② `git diff --name-only -- <产品目录>` 与跑前相同
#   ★ 这两条要**做成脚本里的不变量用例**（**不是"我记得检查"**）
# ```
# ★ **现场正例（已落）**：`plugin/scripts/check-orphans-rule.mjs`
#   ⇒ 跑完自报「不变量：变异测试**不改动产品文件**（sha256 前后相同）」·
#     `MUTANT` 计数 = **0** · 支持 `--module=<path>`（**命令行参数，不用环境变量** ——
#     环境变量会被子进程继承/被别的进程看到 ⇒ **串味**）
#
# ## ⚠️ 与 `R28` 的分工（**两条不是替代关系**）
# ```
# · `R28` 治"**中断后恢复**"（还原做成独立入口）—— **对"自锁"救不回**（原文已丢）
# · `R38` 治"**根本别碰产品文件**"—— **从根上消除自锁的可能**
# ⇒ ★ 一句话：**`R28` 是兜底，`R38` 是不给自己制造底要去兜的处境。**
# ```
#
# ## 判据现状（`R14`）
# ```
# ✅ **已机械化（部分）**：变异测试脚本**自报不变量**（sha 前后相同）—— 但那要**每个脚本自己写**
# ⬜ **候选**：`check-*` 类脚本跑完，**由总入口**核"产品目录 sha 未变"（**外部见证，不靠自觉**）
# ```
#
# **归口**：`engineering-director`。

# ★★★ 【R39】**判据必须够得到它自己的前置** —— 否则它不是判据，是一句恒假（或恒真）的话
#
# 来源：**COO 归纳 + CEO 命名并采纳**（2026-09-15）· 内容 COO 出，**写入与编号归我**（本文件唯一写者）。
#
# ## 现场：**"判据自己让判据不成立"**已出现三次（三个不同维度）
# ```
# ① **范围**：`H29` 只扫 `check-*.mjs` ⇒ **漏了 `verify-*.mjs`**
#      ⇒ 我新写的 `verify-shipped-roles.mjs` **不在范围内** ⇒ 它没接总入口，**而 `H29` 报绿**
#      ⇒ ★ **必然漏报**（与"被检对象好坏"无关）· 处置：扩范围（现已 `^(check|verify)-.*\.mjs$`）
# ② **时间**：`MEETING_STALE_MS = 45*60*1000`（`lib/index.js:64`）⇒ **夹具比阈值老** ⇒
#      **判据永远不可能成立**（无论会议室功能对不对）· 处置：**先刷新夹具**（`utimesSync`，`task-61` D 项）
# ③ **空间**：视口 900 · 目标坐标 947 ⇒ **点在视口外**（`canvas_click_modal.open=false`）
#      ⇒ **必然失败**（无论面板功能好坏）· 处置：**先滚动/调视口**（`task-61` 第二条）
# ⇒ ★★ **共同形态**：**判据的前置，落在判据自己的可见范围之外**。
# ```
#
# ## 规矩
# ```
# 判据里凡涉及 **坐标 / 时间 / 文件新鲜度 / 扫描范围 / 视口** 的前置 ⇒
#   必须过一遍：「**我能不能让它在【判据自己的可见范围内】成立？**」
#     时间 ⇒ **先刷新**（`utimes` / 造新夹具）
#     空间 ⇒ **先滚动 / 调视口**（把目标移进可见区）
#     范围 ⇒ **先扩判据的范围**（正则/目录/白名单）
#   ⇒ ★ 一句话：**判据的前置，必须落在判据自己的可见范围内**。
# ```
#
# ## ★★ 即时可用的检验（**CEO 加，本条最锐利的部分**）
# ```
# 对每条判据问一句：**「它在什么条件下【必然失败】/【必然通过】？」**
#   ⇒ **答得出"必然" ⇒ 那不是判据** —— 它是**噪音**（必然失败）或**恒真**（必然通过）
# ⇒ 现场：视口 900 vs 坐标 947 ⇒ **必然失败** · 夹具过期 ⇒ **必然失败** · `H29` 漏 `verify` ⇒ **必然漏报**
# ```
#
# ## ⚠️ 与 `R25` 的关系（**形态：独立成条，但明确它是 `R25` 的强形态**）
# ```
# · `R25`（已落）：依赖运行时前置的判据 **必须自带前置检查**
# · `R25` 的**弱形态** = 前置不成立 ⇒ **报"前置不成立"**（只是**看得见**）
# · `R25` 的**强形态** = 前置不成立 ⇒ **先让它成立**（`utimesSync` 刷新夹具）
# · ★ 本条 = ★ **连"让它在自己范围内成立"这一步都要先证明** ——
#   否则它**必然失败/必然通过**，而**"前置不成立"这个报告本身也可能永远发不出来**。
# ⇒ ★ 判据不是"我看得见前置"，而是"**前置可达**"。
# ```
