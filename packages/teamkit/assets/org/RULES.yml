# RULES —— 组织治理（要人读的规则文本，不是执行器）
#
# 来源：原版 OMC 的 `company_rules/permissions.yaml`（match→action 规则引擎）+ `company/company_culture.yaml`，
# 提炼成 DSH 能用的形式。
#
# ★★★ **原版那个引擎的真实状态（2026-09-14 / Round 87 逐行核对后更正）**：
#   本条**原先写的是**「原版那个引擎本身**未接线**（ACP 分支**无 caller**，唯一调用点传空参数）」——
#   **前半句是错的**。对着 `D:\app\omc` 源码逐行核，真相更精确、也更有教益：
#   ```
#   · 引擎**实现了**：`src/onemancompany/acp/permission.py` 的 `PolicyEngine` 完整
#     （load / 规则逐条匹配 / cost_usd_gt 特例 / default 兜底），
#     且**有单元测试**（`tests/unit/acp/test_permission.py`，**7 个 `def test_`**，含"拒写别人文件"）
#   · **确实有 caller**：`src/onemancompany/acp/client.py:127` 的 `async def request_permission`
#     （ACP 协议回调，真实路径）⇒ 所以**不是"未接线"**
#   · **但**：它在 `:144` 这么调 —— `engine.decide(tool=tool_name, args={}, context={})`
#     ⇒ **args 与 context 都是空字典**
#   · 而那三条规则**全都依赖 context/args 里的键**：
#       `{tool:"write", target_exists:true, owner_is_self:false}` → 两个键**从来没人传**
#       `{tool:"external_api"}`                                  → `tool` 是**实际工具名**，不是这个字面量
#       `{cost_usd_gt:10.0}`                                     → `cost_usd` 不存在 ⇒ 取 0.0 ⇒ 0>10 假
#     ⇒ 匹配器把它们逐个判否 ⇒ **一条都不命中** ⇒ 落到 `default: allow`
#   ⇒ **真相：引擎是真的、测试是真的、调用也是真的 —— 但经生产路径它"恒允许"。**
#     规则**看着被强制**（有引擎、有测试、有 caller），**实际是橡皮图章**。
#   ```
#   ⇒ **这与本插件 R86 修的"技能里 '我们不' 是空头承诺"是同一个形状**：
#     **"有机制的样子，没有机制的效果"**。⇒ 所以我们也**不抄那个引擎**（抄来只会更像真的）。
#   ⇒ **教训（值得单独记）**：判断"某条规则有没有被强制"，**不能看"有没有引擎/测试/调用"**，
#     要看 **"那条规则依赖的输入，在生产路径上真的被传了吗"** ——
#     这正是 `ROUND 87` 的做法：核对 `decide(...)` 的**实参**，而不是它的**存在**。
#
# DSH 侧更彻底：除了 id/CAS/依赖环检测之外**没有任何强制钩子**。
# 因此本文件的性质是：**协议**。它的效力来自「落盘可审计 + 下一轮真的会去查」。
schema: teamkit/rules@1

must_report_up:            # 必须上报，不许自己拍板（对应原版"CEO 才批"的四类）
  - 要花真钱 / 要动生产 / 要对外发布 / 要删不可恢复的东西
  - 需求自相矛盾且没有默认解
  - 判据本身有问题（做对了也不解决问题）
  - 想扩权：要碰 write_scope 之外的资源

never:
  - 覆盖不属于自己的产物（原版规则原文：`target_exists: true, owner_is_self: false` → reject）
  - 无授权调外部 API（原版规则原文：`tool: external_api` → reject，需显式策略放行）
  - 把"没验证"说成"应该没问题"
  - 评审里只写"整体不错"（必须给**一条反例**或**一个可复现的检查**）
  - 为了像公司而设岗（写不出"这一层唯一的职责"就撤掉）

downstream_handoff:        # 抄原版 company_culture 的"下游思维"
  - 干完必须指定**下一个接手人**；没有下游交接的活不算完成
  - 交付物必须能被接手人独立复核：给证据指针，不给过程叙述
  - **交接质量是成长的第二轴**（委托方 2026-09-12 裁定）：写明【谁接 / 接什么 / 什么时候算接住】；
    **"接住"= 接手人能独立复核并复现**，不是"我看过了"。成长只有两轴（垂直深度 + 交接质量），**没有"晋升"这一轴** —— 见 `runs/005-role-skills/GROWTH.md`

cost_valve:
  - 单次操作超预算 → 停并上报（原版规则原文：`cost_usd_gt: 10.0` → reject）
  - 全局到点 → 产出「当前最好状态 + 缺什么」，哪怕没做完
  - DSH **没有** token/成本读数 → 预算只能用**调用数 / 轮次 / 墙钟**折算，别假装有账单

escalation_shape:          # 升级必须长这样，否则上层无法裁决
  - 把问题改写成**决策问题**：A vs B，各自的代价
  - 附两边证据指针 + 你的倾向 + 需要对方做什么（拍板 / 授权 / 改判据）

# ★★★ 判据纪律：「探针类任务」（验证"某能力通不通 / 某动作会不会被拦"）怎么算做完
#
# 来源：`e2r-landing` 在 `A2A-BOUNDARY.md` 里提出、CEO 采纳（2026-09-14）。
#   **真调定有无，源码行定位置** —— 两样都要，缺任一条都可能是假事实：
#     · **真调** 回答"这条路径上，那个判断**真的被走到了吗**"；
#       反例（本项目自己踩的 `H42`）：规则完整、调用也是真的，**但实参是空字典**
#       ⇒ 判据恒不命中 ⇒ 有机制的样子、没有机制的效果。
#     · **源码行** 回答"**拦在哪**"。
#       没有它，"会被拒"就是一句空头承诺 —— 读者无从复核（这正是 `H41` 盯的事）。
#   ⚠️ **顺序也是判据的一部分**：先真调拿到原始返回，**再**去源码找对应行。
#     反过来做（先读源码推断"应该会被拦"）会**污染读数** —— 你会只去找支持预期的证据。
probe_discipline:
  - 探针的交付必须是**原始返回逐字**（含 `Error:` 前缀与错误码），不是"我读源码知道会被拒"
  - 写"会被拒 / 会报错"必须**同时**给出：原始返回 **+** 真会拦的那一行（`文件:行号` + 那行代码）
  - **破坏性探针必须自带"就算意外通过也伤不到东西"的设计**（例如把参数设成本来就是空的值），
    而不是靠"我预期它会被拒"
  - 探针**不许留垃圾**：建出来的对象要么删掉、要么说明为什么删不掉
  - **未获取是合法结论，猜不是**：拿不到读数就写「未获取」+ 列出试过的路径

# ★★★ 【R1】任务描述与交接稿里的**每个前提**，要么带**读数出处**，要么显式标「未核」
#
# 来源：`product-director` 提案 + `engineering-director` 定稿（2026-09-14，CEO 交办"你俩定归口"）。
#   **禁止把"看起来应该成立"写成前提传给下游。**
#
#  触发条件（**四条都有实证**，不是假想）：
#    · **数字类前提** —— "原版 `execute_hire()` 23 步"：**那个数是编的**，原版全仓 0 命中，
#      而它**扩散到 5 个文件**（含 `notes/`）。**假数字 + 真 `file:line` = 最像证据的假证据**（`H43` 盯这条）。
#    · **机制类前提** —— 「原版权限引擎未接线 / 无 caller」这句**是错的**（见本文件上方 `H42` 的更正：
#      引擎真、有 caller，只是喂进去的实参全空 ⇒ 在生产路径上恒允许）。
#      **错断言扩散到 4 个副本**（`H42` 盯这条）。
#    · **跨辖区互为前提**（★ 最隐蔽的一类）——
#      本轮甲（总工程师）假设"**角色档是分层的真源**"、乙（产品总监）假设"**roster 有 role 可分层**"，
#      **两条各自都没被核过的前提拼起来，正好得出"分层能画出来"** ——
#      直到真读数把它们同时推翻：**21 人里只有 5 人有角色档（23.8%）**、
#      **roster 的 role 21/21 全是 `teammate` 且根本没有 lead**。
#      ⇒ **教训：交接时双方未核的前提会互相补齐成一条假链条** ——
#        各自看自己那半"有依据"，合起来却没有一环被真验过。
#    · **过期前提** —— 引述了一条**已解除的约束**（"不许动 profile 依赖"），而没去核
#      "谁说的、什么时候、还算不算" ⇒ 白挂了很多轮的"仍未验"。
#
#  执行：
#    · 写描述/交接稿的人**自己**核一次；**核不动就标「未核」并写明试过什么**；
#    · **接手方**在开工前对自己依赖的每条前提做一次**独立核对**——
#      这与 `D-2`（上级不预先下诊断结论）是同一件事的两种身份；
#    · ⚠️ **不许**用"读起来很具体"代替"核过"：**具体 ≠ 真**
#      （`H43` 的教训：假数字 + 真指针最像证据）。
#    · 判据（可机械核）：**描述里每个 `file:line` 都要真能指到那件事**；
#      拿不出指针的断言，必须带「未核」二字。

# ★★★ 【R2】探针**不许往"会被持久化的共享对象"上写字段 / 改原型**
#
# 来源：**P0 事故**（2026-09-14；`runs/005-role-skills/INCIDENT-P0-BOARD-CORRUPTION.md`；
#   执行者提议 + CEO 批；总工程师落盘）。
#
# **事故样例（逐字，别重犯）**：一支探针为了验证"包视图能否让字段可见"，
#   包了 `at.journal.state` 并做 `s.tasks = s.tasks.map(t => ({ ...t, e2rProbe: 'INST-WRAP' }))`。
#   本意是**只读验证**，但那个 task 对象**会被底座经 `team/task` 事件持久化**，而
#   `teamTaskSnapshotSchema` 是 **`.strict()`** ⇒ 多一个键 ⇒ `parsePersisted` 抛 ⇒
#   `state.failure` 置位，且 **`projection.js:157` `if (state.failure !== undefined) return`**
#   ⇒ **此后所有 Team 事件一律被跳过（永不自愈）** ⇒ **全公司读不到板**。
#   ⇒ 一次"只读意图"的探针，造出了**一条永久落盘的脏事件**（盘上 1 条 → 内存里 **59/82** 个 task）。
#
# **规矩**：
#   · 只读验证**走副本**（clone 再改）或**旁路观测**（读回原值比较）；
#   · **绝不**对底座/宿主的**实例或其原型**做 `obj.x = …` / `Object.defineProperty(obj.prototype, …)`；
#   · 若**确需**包装：必须**同一次调用内还原** + **回读验证"已还原"**，
#     并把回读读数打出来 ——「**我包装了**」不是证据，「**回读等于原值**」才是；
#     ⚠️ **只写注释声称"会还原"不算**（那是 `H41` 家族：**文案不是机制**）。
#   · **判据是机械的**：探针源码里出现"对入参对象赋值 / 改原型"却**无回读校验** ⇒ **判红，没有例外**
#     （断言 `H46`；`selftest` 里可复核）。
#
# ★★★ 【R3】"复现失败"必须附带**采样窗口**；**窗口在修复之后 ⇒ 不构成反证**
#
# 来源：`e2r-landing` 的自纠（2026-09-14，CEO 转达；总工程师落盘）。
#   **它的原话**：
#   > 「我把一条 P0 级故障判成"**瞬时失败、未复现**" —— 因为我 3 次采样**恰好在修复之后**。
#   > ⇒ **"我复现不了" ≠ "它没有发生"。复现失败 ∧ 已有人报同症状 ⇒ 升级问证，而不是降级否认。**」
#
# **为什么单列**：它**差点把一次全公司板不可读的事故判成"没有这回事"**，
#   而它的证据（"我采样了 3 次"）**必然复现不了** —— 因为窗口落在修复之后。
#   ⇒ 这与本项目的老毛病同族：**"我没看到"被当成"不存在"**
#     （反例族：R41「工具名可见 ≠ 能调用」、R87「有 caller ≠ 参数有效」、
#      `H42`「规则真、调用真，但实参空 ⇒ 恒不命中」）。
#
# **规矩**（可机械核）：
#   · 报"复现失败 / 无法复现"时，**必须写明采样窗口**（时间范围 + 它落在**修复之前还是之后**）；
#   · **窗口在修复之后 ⇒ 复现失败不构成反证** ⇒ 只能记「**未获取**」；
#   · **同期有人报同症状 ⇒ 升级问证**（问对方要读数、时间戳），**不许降级否认**；
#   · 判据：报告里每一条"未复现"，都要能指到它的**窗口起点与终点**。

# ★★★ 【R4】"我们的生产" vs "用户正在用的宿主" —— **处置权不同**
#
# 来源：CEO 裁定（2026-09-14，P0 事故 `A5` 的归属；总工程师落盘）。
#
# **分界（逐字）**：
# ```
# · 「我们的生产」= 板 / 插件 / 面板（**我们有处置权**）
# · 「用户正在用的宿主」= **用户的**（我们只有**建议权**，且**必须说清中断影响**）
# ⇒ 重启会中断**用户此刻正在进行的会话**（含全部成员 + 用户正与 CEO 对话的那个会话）
# ⇒ **动它的决定权不在我们** ⇒ 裁"不做"，并把"若要做会断什么"**如实告诉用户**。
# ```
# **规矩**：
#   · 动作前先分类：**改的是"我们的产物"还是"用户的环境"**；
#   · 后者 ⇒ **不擅自做**，写清【要动什么 / 会中断什么 / 不做的代价 / 回退】，**交用户裁**；
#   · 因此类动作导致"要真重启才能拿到的读数"⇒ **一律记「未获取」**，
#     **不许**用"同代码等价复现"顶替成"已验证"（见 `R3` 同族：**推理 ≠ 读数**）。
#
# ★★★ 【R5】结论措辞不许**超出读数所能支撑的范围**
#
# 来源：CEO 收紧（2026-09-14，P0 报告里我写的「重启不再复发」；总工程师落盘）。
# **原句**：我证的是"**冷路径在缓存不存在时会回落并从 journal 重折**"，
#   而"重启"这个动作**本身没有被执行过**。
# ⇒ 正确措辞：
# ```
# · ✅ **已证**：引信已移除（缓存行不存在）+ 冷路径回落正确（真模块重放 16111 帧、零抛错）
# · ⬜ **未获取**：真重启读数
# ⇒ 结论 = 「**复发风险已消除（按冷路径）**」
#    ✗ 不是「**重启不再复发**」（后者需要一个**真重启读数**）
# ```
# **为什么不是抠字眼**：本项目栽过多次「把推理当读数」——
#   R87「有 caller」→ R89 真跑才发现**工具名恒空**；
#   `H42`「规则真、调用真」→ 但**实参是空字典 ⇒ 恒不命中**。
# **判据（可机械核）**：凡结论句里出现"**已/不会/不再**"之类**断言式措辞**，
#   该句必须能指到一条**同范围的读数**；指不到 ⇒ 改写成「**按 X 已证 / 按 Y 未获取**」两段。
#
# ────────────────────────────────────────────────────────────────────────────
# ★★★ **第二半（2026-09-15 加）："为什么"也要有读数支撑 —— 解释句与结论句同责**
#
# **来源**：`product-director` 核出「第一半只抓"结论句"、盖不住"解释句"」+ **CEO 裁定并进**
#   （**不另立编号**：同族、同一动作，`R10` 不该有两个入口；且"分开写会让人以为过了一半就够了"——
#     ★ **而 CEO 两次栽的正是"过了第一半、解释句仍漏"**）。
#
# **现场（两次，★ 都是 CEO 本人 ⇒ 它不是"下级纪律"）**：
# ```
# ① 它写：「它们**有两条引用路径**，我只有到了一条」
#      ⇒ ★ **实测只有一条**（它那条"第二条"在 `notes/backup/` 里 —— 那是**派生副本**）
# ② 它写：「**每做一次备份 ⇒ 被引用数虚增**」
#      ⇒ ★ **实测虚增 = 0**（含/排除 `backup/**` 都是 47）
# ⇒ ★ 两次**结论本身对，而"为什么"超出了读数** ⇒
#   而 CEO 自己给的理由（我认）：**"结论对，不代表对它的解释对；而解释会被下一次引用"**
#     ⇒ **假解释会让人去找不存在的路径 / 找不存在的虚增案例**
# ```
#
# **第二半的规矩**：
# ```
# · **抓取**：结论段里所有「**因为 | 所以 | 否则 | 必然 | 会系统性 | 会导致**」后的**从句**
# · **每条从句** ⇒ **必须能指到一条【实验读数】**（或标「**未获取 / 可能**」）
# · 做不到 ⇒ ★ **降级为「可能 / 倾向于 / 未获取」** ——
#   **不许用"想当然的机制"把因果填满**
# ```
# **与第一半的关系（★ 两条一起才封住）**：
# ```
# · 第一半管【**结论句**】（"已/不会/不再"）  ← 断言"**事情是什么状态**"
# · 第二半管【**解释句**】（"因为/所以"）      ← 断言"**为什么是这个状态**"
# ⇒ ★ **读 `R5` 的人必然看到两半** ⇒ **不可能只过一半**（这正是"并进"的理由）
# ```
# **约束谁**：**所有写报告 / 复盘 / 裁定的人** —— ★ **现场两次都是 CEO 本人**（故它不是"下级纪律"）。
#
# ⚠️ **按 `R14` 标「备忘」**：**"解释句有没有读数支撑"没有机械判据** ⇒ **不冒充机制**
#   （候选机械化：抓因果连词后的从句 ⇒ 要求同段内有 `实验读数|未获取|可能` 之类标记；**未做**）
# ────────────────────────────────────────────────────────────────────────────

# ★★★ 【R6】**"释放 owner" ≠ "完成"** —— 它会造出下游死锁
#
# 来源：COO 出判据 + 真实死锁（2026-09-14）；总工程师落盘（`task-87` 系列同批）。
#
# **现场（真实，可核）**：
# ```
# task-69  status=pending / owner=空 / ready=true
# task-68  blocked_by=[task-69]  ⇒ **永不 ready**（下游永久阻塞）
# 根因：owner 把"更新描述 + 释放 owner"当成了"交付"
# ```
# ⇒ **后果**：任务**既没完成、也没人拥有**，而**下游被它钉死** ——
#   且**没有任何信号**（板子上看起来只是"有个 pending 任务"）。
#
# **规矩（可机械核）**：
#   · **任一 `status !== 'completed'` 的任务被 `release`** ⇒ 必须检查
#     「是否有其它**未完成**任务 `blocked_by` 指向它」；
#   · **有 ⇒ 不许 release**（或**同时指定接手人**，让 owner 不为空）；
#   · 一句话：**"我不做了"必须要么把任务做完、要么交给下一个人，不许直接撒手。**
#
# **为什么它属于"底线"那一族**：它和 `R2`（探针写共享对象）是同一种病的两个面 ——
#   **一个动作的副作用落在"别人看不见的地方"**（前者是磁盘事件，后者是任务图依赖）。
# ⚠️ 若能进 `selftest` 更好（机械）；进不去就**文本 + 巡检**（COO 巡检）。
#    （**未机械化前，本条是协议，不是机制** —— 不许说成"已强制"。）

# ★★★ 【R7】宿主私有格式：**直接禁，不立级数**
#
# 来源：COO 判定 + CEO 采纳（2026-09-14，`task-86` 会议；总工程师落盘）。
#
# **为什么连级数都不给**：级数意味着"报批后可以做"；
#   而**会话日志 / 投影缓存**这两种私有格式，**两种填充方案宿主都拒**：
# ```
# · 0x00 补零          ⇒ 拒
# · zstd skippable frame ⇒ 拒（`invalid frame magic at byte 28937489`）
#   ⇒ **没有"可证明安全"的做法** ⇒ 立级数只会给它一个**合规的外壳**。
# ```
# ⇒ **规矩**：
#   · **禁止**对 `session.v3.jsonl.zstd` / `session_projcache/**` 做**任何**落地写入
#     （**包括"保持长度不变"的原地改写**）；
#   · 若判断"必须改" ⇒ **先换路**（绝大多数情况有只读等价做法：见 §0 换路判据）；
#   · **产出的"我们要读的结论"，永远可以从只读路径得到** —— 出事时**优先只读**。
#   · ⚠️ 与之配套的**正向做法**（`task-86` 复盘用过的）：清**内存**投影（只读探针 + 清内存）
#     即可让板恢复可读 ⇒ **同一个目标存在"写入清单为空"的换路**。

# ★★★ 【R8】`probeGate`：在线拦 `dev_stage_add` —— ⚠️ **生效范围按挂载方式而定；"全宿主"这条已被真读数推翻**
#
# 来源：CEO 裁定（2026-09-14，`task-92`；总工程师落盘）。执行者：`e2r-landing`。
#
# ## 它是什么
# 用**底座自带的文档化扩展口** `ctx.tools.guard(fn)` 在 `dev_stage_add` 装上前跑 `R2` 的判据：
# ```
# dsh-tools/lib/index.js:2816-2821  guard(fn) —— 文档化口（非 hack）
# :3127-3139                        返回字符串 ⇒ 包成 `Error: <reason>` 回模型 ⇒ **真拒**
# ```
# ⇒ **不必改 `D:\dsh\super-injector`（别人的仓）**，也**不必改 DSH 本体/底座**。
#
# ## ★★ 生效范围：**⚠️ 不是 global 层 —— 按挂载方式而定**（**真读数推翻了我先前的推断**）
#
# ⚠️⚠️ **本节原先写的是「落在 global 层 ⇒ 对全宿主生效」—— 那是【推断】，已被真读数推翻。**
# ```
# 我先前的依据（读源码）：dsh-scope/lib/index.js:189-203  scopeOf(ctx)===undefined ⇒ layer=this.global
#   + PLUGIN-SCOPE.md「插件 apply 拿到的 ctx 就是宿主 ctx」⇒ 推出"落 global"
#
# ★ 真宿主只读探针（2026-09-14，`engineering-director` 自己跑）：
#   tools.layers.global.guards  = **[]**（**空**）                     ⇒ **不在 global 层**
#   tools.layers.scoped 里持有本闸的那一层，key = **{"agentPreset":"omc"}**
#   逐个 agent 真调 `tools.guardReason({name:'dev_stage_add', agent, arguments:{execute:<违规源码>}})`：
#     session-449fe43b (closedloop-full, root)  ⇒ **denied=true**（被拦）
#     session-fa986645 (standard, root)         ⇒ **denied=false**（**没被拦**）
#     00bad638-7cf0    (standard, child)        ⇒ **denied=false**
#     02b63878-b80a    (standard, child)        ⇒ **denied=false**
#   ⇒ **实测：`standard` 的 3 个 agent 都没被这道闸覆盖。**
# ```
# ⇒ **所以"全宿主生效、偏离既有口径"这条声明【不成立】。** 准确说法（有读数的部分）：
#   · **本闸挂在"挂载它的那个 preset realm 的 scope"上**（当前 = `{"agentPreset":"omc"}`）；
#   · **`standard` 预设的 agent 不在它的 scope 链上 ⇒ 不被拦**；
#   · ⚠️ **仍未获取**：为什么那次采样里 **`closedloop-full` 的 root 被拦了**（它的 scope 链上为何
#     命中了 omc 那层）—— **我有读数但解释不了，不编**。
#   · **推论（待验）**：**经 `dev_inject_plugin` 宿主注入**时 ctx 可能是宿主 ctx ⇒ 那时才会 global；
#     **经 `omc` 预设挂载**时 ctx 带预设 scope ⇒ 只覆盖该 realm。**这条需要专门实测才能确认。**
# ⇒ **对安全口径的影响（要紧）**：按我们自己的理由（"一个 `standard` 成员的坏探针一样会把板弄坏"），
#   **当前形态是"窄的"** ⇒ **`standard` 成员的坏探针目前没人拦**。
#   ⇒ 要不要把它做成真 global（挂到宿主 ctx），是**待裁的**，**不许当成已经全局**。
# ⇒ 每一处提到本闸的地方（`PROBE-GATE.md` / `README.md` / 自测输出）**都必须按上面这条改**，
#   **不许再写"全宿主生效"**。
#
# ## ★★ liveness 红线（**这一节不受上面更正影响，仍然成立**）
# ```
# `guardReason` 会在**每一次被允许的工具调用**上被调（`dsh-tools:3127`，先查 `:2824` global，
# 再走 `chainLayers(exec.agent)`）⇒ **落在哪个层都在热路径上** ⇒
# 一旦它慢 / 抛 / await ⇒ **该 scope 链上的所有 agent 停摆**（而这正是委托方禁止的"停摆"）。
# ```
# ⇒ **硬约束（缺一不可）**：
#   · **第一行判 `exec?.name !== 'dev_stage_add'` ⇒ 立刻 `return undefined`**（O(1)、无副作用、不读盘）；
#   · **整体 try/catch ⇒ 出错一律放行（fail-open）** —— 护栏故障**绝不许**挡住正常工作；
#   · **不 await / 不读盘 / 不抛**（三条都要在自测里**逐条有断言**）。
#
# ## 判据（**七条，缺一条就不算做完**；⑤⑥⑦ 为 CEO 追加）
# ```
# ① 普通工具调用 ⇒ **原样放行**（零影响）
# ② 违规探针     ⇒ **拒**（贴 `Error: 【R2…】` 原文）
# ③ 合规探针     ⇒ **放行**
# ④ **故意让 guard 内部抛错 ⇒ 仍必须放行**（fail-open 的变异测试）
# ⑤ **性能**：普通工具调用的延迟**不因它而可测地变差**（贴改前/改后 p50；拿不到写「未获取」）
#    ⚠️ 不许用"代码看起来很快"当结论（CEO 有现场数据：面板每次轮询重算 ⇒ 32.5%–50% pending 率）
# ⑥ **不 await / 不读盘 / 不抛** —— 逐条断言
# ⑦ **全局生效要有证据**：`standard` 会话里**也能观察到**这道闸（否则"全局"只是声称）
# ```
#
# ## ★ 覆盖范围（**不许升格**）
# ```
# 它覆盖：**挂载本闸的那个 preset realm**（真读数：现 = `omc` 那层）的 `dev_stage_add` 调用
# ⚠️ **不覆盖 `standard` 等其它预设**（真读数：那 3 个 agent `denied=false`；且有**活复现** ——
#    `standard` 的 agent 真调 `dev_stage_add` 装违规探针 ⇒ **"OK: 已挂后侧"** ⇒ 缺口被证）
#     ⇒ 这是**已知缺口**，准确说法：「**`standard` 成员的坏探针目前没人拦**」
# 它**不**覆盖：pwsh / `node -e` 内联改共享对象 · 注册前已 staged 的 · 别的注入路径
# ⇒ 准确说法：「**把两次事故走的那条路拦住了**」，
#   ✗ 不是「R2 机械化了」（那只是 `D-10` 第 3 道防线的**一部分**，不是全部）
#   ✗ 也**不是**「全宿主都有保护」（**假的** —— 见 `plugin/lib/probe-gate.js` 头部留痕）
# ```
#
# ★★ 【R10】**单一事实来源（SOT）**：会被反复引用的**事实值**只写 1 处
#
# 来源：**CEO 的现场观察**（2026-09-14）—— 同一句更正（"不是全宿主 / `standard` 没护"）
#   在 **4 个文件里重复了 12 遍**。⇒ 撞上刚立的"纪律分机制/备忘"那条的推论：
#   **一条事实写在 12 处 ⇒ 下次它一变，又要改 12 处。**
#
# **为什么这条值钱**：本项目**已多次**栽在"同一句话抄多份"上：
# ```
# R87「未接线」抄了 4 份   ·   R88「23 步」抄了 5 份   ·   R90/R91 数字指标各 2 份
# 本次：同一句"生效范围"更正 12 处（**刚修好，此刻都对**）
# ⇒ 共同形态：**抄的是"结论"，所以源头一变，副本全成旧话**。
# ```
# **规矩**：
# ```
# · 一条**会被反复引用的事实**（数字 / 生效范围 / 限制）⇒ **只写在 1 处**
#   （首选**面向读者的文档**：`plugin/README.md` 或 `runs/005-role-skills/PROBE-GATE.md` 这类）
# · 其它地方**只给指针**（`见 README §配置` / `见 PROBE-GATE.md §3`），**不重复正文**
# · 例外：**代码里"为什么这么写"的注释**可以重复**理由**，但**不许重复"事实值"**
# ```
# **判据（可机械）**：**同一句事实断言若在 ≥3 个文件里逐字出现 ⇒ 报红**（提示"该改为指针"）。
# ⚠️ **存量不强制重构**（CEO 裁）：那 12 处**刚修好且都对** ⇒ 此刻改它们**没有生产力收益、纯风险**。
#   按 `ORG.md §0.1②`（**约束是为了专注，不是为了服从**）⇒ **只对新增生效，存量等下次真需要改时顺手收敛**。
#
# ★★ 【R11】**"验证"的双读数：查询侧 + 端到端侧，并写清各自覆盖到哪**
#
# 来源：**CEO 命名**（2026-09-14；`engineering-director` 在 `task-92` 上做出来的形态）。
# ```
# · **查询侧**：直接读内部状态（快、能看细节、**但可能不代表真实路径**）
# · **端到端侧**：真走一遍（慢、有副作用、**但它才是真的**）
# ⇒ **两者都做**，且**写清哪个覆盖到哪**。
# ```
# **现场示范（本项目的正例）**：
# ```
# 查询侧：`tools.guardReason({…})` 逐 agent ⇒ `standard` 三个 agent `denied=false`
# 端到端：`standard` 的 agent **真调** `dev_stage_add` 装违规探针 ⇒ **"OK: 已挂后侧"** ⇒ 缺口被证
# 并**标注覆盖边界**：「**没在 `omc` 里复现**（那要开新会话）；omc 侧依据是查询侧读数」← **两件事不混**
# ```
# ⇒ **判据**：凡结论涉及"某机制在某范围内成立/不成立"，**必须同时给**：
#   ① 查询侧读数 ② 端到端侧读数（或显式写「端到端未做 + 为什么」）③ **各自覆盖到哪**。
#   ⚠️ **只有查询侧 ⇒ 标「未获取端到端」**，**不许**当成"已验证"（`R3`/`R5` 同族）。
#   ⚠️ **端到端有副作用 ⇒ 必须自带零副作用设计**（同 `probe_discipline`：用完 demote / 不调用）。


